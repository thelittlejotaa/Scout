<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASAS FTC Scouting - #32510</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header-container">
    <div class="header-left">
      <img src="/logo.png" alt="ASAS FTC 32510 Logo" class="header-logo">
      <div class="header-titles">
        <h1>ASAS FTC Scouting</h1>
        <span class="team-badge">Equipe #32510 - ASAS FTC</span>
      </div>
    </div>
  </header>

  <main class="container">
    
    <section class="card">
      <h2>1. Cadastrar de Nova Equipe</h2>
      <form id="form-cadastrar-equipe">
        <label for="team_number">Número da Equipe *</label>
        <input type="number" id="team_number" placeholder="Ex: 32510" required />

        <label for="team_name">Nome da Equipe *</label>
        <input type="text" id="team_name" placeholder="Ex: ASAS FTC" required />

        <label for="city_state">Cidade / Estado</label>
        <input type="text" id="city_state" placeholder="Ex: Rio de Janeiro - RJ" />

        <label for="robot_name">Nome do Robô</label>
        <input type="text" id="robot_name" placeholder="Ex: Santos Dumont" />

        <button type="submit" class="btn">Cadastrar Equipe</button>
      </form>
    </section>

    <section class="card">
      <h2>2. Adicionar Observação / Foto</h2>
      <form id="form-atualizacao" enctype="multipart/form-data">
        
        <label for="select_team">Selecione a Equipa *</label>
        <select id="select_team" required>
          <option value="">Carregar...</option>
        </select>

        <label for="update_date">Data da Observação *</label>
        <input type="date" id="update_date" required />

        <label for="title">Titulo / Assunto</label>
        <input type="text" id="title" placeholder="Ex: Ajuste na garra / Inspeção" required />

        <label for="comment">Observação Detalhada *</label>
        <textarea id="comment" rows="3" placeholder="Detalhes do que mudou no robô..." required></textarea>

        <label for="image">Foto do Robo / Peça</label>
        <input type="file" id="image" accept="image/*" />

        <button type="submit" class="btn btn-primary">Salvar Observação</button>
      </form>
    </section>

    <section class="card full-width">
      <h2>3. Consultar Histórico e Fotos da Equipe</h2>
      <select id="select_team_view">
        <option value="">Selecione uma equipa para ver...</option>
      </select>
      
      <div id="timeline" class="timeline-container"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
